version: '3'

networks:
  tiamat:
    driver: bridge

services:
  default:
    container_name: "tiamat"
    build:
      context: .
      dockerfile: "Dockerfile"
    ports:
      - 8080:8080
      - 1302:1302
    networks:
      - tiamat
    volumes:
      - ./sample-config/:/home/tiamat/.config/tiamat/
